        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // High quality perspective camera
        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 10);
        // Positioned slightly elevated to give clear 3D perspective of both stick height and magnet base
        const defaultCamPos = new THREE.Vector3(0, 0.15, 0.13);
        const lookTarget = new THREE.Vector3(0, 0.02, 0);
        camera.position.copy(defaultCamPos);
        camera.lookAt(lookTarget);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Studio lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff6e8, 1.8);
        dirLight.position.set(0.12, 0.35, 0.18);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.8);
        rimLight.position.set(-0.15, 0.1, -0.15);
        scene.add(rimLight);

        // Ground contact shadow & polarity pulse ring at base

        const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
        const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
        shadowMesh.position.y = 0.0002;
        scene.add(shadowMesh);

        const loader = new THREE.GLTFLoader();
        loader.load(glbData, function(gltf) {
            stickModel = gltf.scene;
            stickModel.traverse(function(child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            stickPivot.add(stickModel);
        });

        // Target orientation quaternion & smooth interpolation
        const targetQuat = new THREE.Quaternion();
        const currentQuat = new THREE.Quaternion();

        // Public API called from Android Compose via evaluateJavascript
        window.updateOrientation = function(tiltRad, dirX, dirY) {
            if (tiltRad <= 0.001) {
                targetQuat.identity();
            } else {
                // Lean axis is perpendicular to in-plane direction (Screen X = right, Screen Y = down/front)
                // In Three.js: +X is right, +Y is up, +Z is towards viewer (front)
                // dirX leans towards +X, dirY leans towards +Z
                const axis = new THREE.Vector3(-dirY, 0, dirX).normalize();
                targetQuat.setFromAxisAngle(axis, tiltRad);
            }
        };

        // Touch orbit interaction
        let isTouching = false;
        let lastTouchX = 0, lastTouchY = 0;
        let camTheta = 0, camPhi = 0.85, camRadius = 0.20;

        function updateCameraFromAngles() {
            camera.position.x = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
            camera.position.y = camRadius * Math.cos(camPhi);
            camera.position.z = camRadius * Math.sin(camPhi) * Math.cos(camTheta);
            camera.lookAt(lookTarget);
        }

        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isTouching = true;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            }
        });

        container.addEventListener('touchmove', (e) => {
            if (isTouching && e.touches.length === 1) {
                const dx = e.touches[0].clientX - lastTouchX;
                const dy = e.touches[0].clientY - lastTouchY;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                camTheta -= dx * 0.012;
                camPhi = Math.max(0.15, Math.min(Math.PI / 2 - 0.05, camPhi - dy * 0.012));
                updateCameraFromAngles();
            }
        });

        container.addEventListener('touchend', () => { isTouching = false; });
        container.addEventListener('dblclick', () => {
            camTheta = 0;
            camPhi = 0.85;
            updateCameraFromAngles();
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            currentQuat.slerp(targetQuat, 0.22);
            stickPivot.quaternion.copy(currentQuat);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
